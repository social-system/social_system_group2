[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi[standard]>=0.136.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "scripts*",
]
exclude = [
    "alembic*",
    "docs*",
    "tests*",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
